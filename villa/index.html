<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"/>
<meta name="apple-mobile-web-app-title" content="فلل المعبيلة"/>
<meta name="theme-color" content="#0D5C4A" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0E3A30" media="(prefers-color-scheme: dark)"/>
<title>فلل المعبيلة 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
:root{
  --bg:#EEF4F1;--surface:#FFFFFF;--surface2:#F3F8F6;--ink:#14231E;--ink2:#3F524A;--mut:#6E8079;
  --line:#D7E3DD;--line2:#BFD0C8;--pri:#0E7C66;--pri-ink:#FFFFFF;--pri-soft:#DCF1EA;
  --danger:#C4321F;--danger-soft:#FCE9E6;--focus:rgba(14,124,102,.28);--scrim:rgba(10,30,24,.45);
  --hero:#0D5C4A;--hero-ink:#FFFFFF;--hero-mut:rgba(255,255,255,.72);--hero-hover:rgba(255,255,255,.14);
  --c-teal:#0E7C66;--c-blue:#2a78d6;--c-orange:#eb6834;--c-aqua:#1baf7a;--c-yellow:#eda100;
  --c-magenta:#e87ba4;--c-green:#008300;--c-violet:#6250d6;--c-red:#e34948;
  --r-lg:16px;--r:11px;--r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1613;--surface:#14201C;--surface2:#1A2924;--ink:#E4EEEA;--ink2:#B4C6BE;--mut:#7F948B;
  --line:#243630;--line2:#30463E;--pri:#3FB596;--pri-ink:#04221A;--pri-soft:#123128;
  --danger:#F0706A;--danger-soft:#3A1C1A;--focus:rgba(63,181,150,.3);--scrim:rgba(0,0,0,.6);
  --hero:#0E3A30;--hero-ink:#FFFFFF;--hero-mut:rgba(255,255,255,.66);--hero-hover:rgba(255,255,255,.1);
  --c-teal:#3FB596;--c-blue:#3987e5;--c-orange:#d95926;--c-aqua:#199e70;--c-yellow:#c98500;
  --c-magenta:#d55181;--c-green:#2e9b3a;--c-violet:#9085e9;--c-red:#e66767;
}}
:root[data-theme="dark"]{
  --bg:#0D1613;--surface:#14201C;--surface2:#1A2924;--ink:#E4EEEA;--ink2:#B4C6BE;--mut:#7F948B;
  --line:#243630;--line2:#30463E;--pri:#3FB596;--pri-ink:#04221A;--pri-soft:#123128;
  --danger:#F0706A;--danger-soft:#3A1C1A;--focus:rgba(63,181,150,.3);--scrim:rgba(0,0,0,.6);
  --hero:#0E3A30;--hero-ink:#FFFFFF;--hero-mut:rgba(255,255,255,.66);--hero-hover:rgba(255,255,255,.1);
  --c-teal:#3FB596;--c-blue:#3987e5;--c-orange:#d95926;--c-aqua:#199e70;--c-yellow:#c98500;
  --c-magenta:#d55181;--c-green:#2e9b3a;--c-violet:#9085e9;--c-red:#e66767;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input::-webkit-search-cancel-button{display:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.sm{width:17px;height:17px}

/* App bar */
.bar{position:sticky;top:0;z-index:50;color:var(--hero-ink);background-color:var(--hero);background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:22px 22px;background-position:center top;padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bar-in{max-width:1240px;margin:0 auto;height:68px;padding:0 16px;display:flex;align-items:center;gap:12px}
.proj{flex:1;min-width:0;text-align:right;display:flex;flex-direction:column;align-items:flex-start;padding:4px 0}
.proj .nm{font-size:.84rem;color:var(--hero-mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.proj b{font-size:1.32rem;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.proj b small{font-size:.62em;font-weight:500;color:var(--hero-mut);margin-inline-start:4px}
.icon-btn{width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;color:var(--hero-ink);transition:background .15s}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:var(--hero-hover)}
.nav-top{display:flex;gap:2px;margin-inline-end:8px}
.nav-top button{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:var(--r);color:var(--hero-mut);font-weight:500;font-size:.92rem}
.nav-top button:hover{background:var(--hero-hover);color:var(--hero-ink)}
.nav-top button[aria-current="page"]{background:rgba(255,255,255,.18);color:var(--hero-ink)}
.menu-wrap{position:relative}
.menu{position:absolute;top:46px;left:0;min-width:236px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:60}
.menu button,.menu label{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:var(--r-sm);font-size:.93rem;cursor:pointer;color:var(--ink)}
.menu button:hover,.menu label:hover{background:var(--surface2)}
.menu small{display:block;color:var(--mut);font-size:.78rem}
.menu svg{color:var(--mut)}

/* Search */
.search{max-width:1240px;margin:0 auto;padding:0 16px 14px;display:flex;gap:8px}
.search .btn-ghost{color:var(--hero-ink)}
.search .btn-ghost:hover{background:var(--hero-hover)}
.field-s{flex:1;position:relative}
.field-s svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.field-s input{width:100%;height:44px;border-radius:var(--r);border:1px solid transparent;color:var(--ink);background:var(--surface);padding:0 40px 0 40px;font-size:1rem;outline:none}
.field-s input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--focus)}
.field-s .clr{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}

/* Layout */
.page{max-width:1240px;margin:0 auto;padding:20px 16px 120px;display:grid;grid-template-columns:248px minmax(0,1fr);gap:28px;align-items:start}
.page.single{display:block;max-width:820px}
.side{position:sticky;top:84px}
.side h2{font-size:.8rem;font-weight:600;color:var(--mut);margin:0 10px 8px}
.sec-link{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:var(--r);text-align:right;color:var(--ink2);transition:background .12s}
.sec-link:hover{background:var(--surface2)}
.sec-link[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tile{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:var(--sc);background:color-mix(in srgb,var(--sc) 15%,transparent)}
.tile svg{width:18px;height:18px}
.sec-link[aria-current="true"] .tile{background:var(--sc);color:#fff}
.tile.lg{width:42px;height:42px;border-radius:12px}
.tile.lg svg{width:22px;height:22px}
.sec-link .t{flex:1;min-width:0;font-size:.93rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-link .v{font-size:.8rem;color:var(--mut)}
.chips{display:none}

/* Section head */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;line-height:1.3}
.head p{color:var(--mut);font-size:.9rem;margin-top:2px}
.head p .num{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border-radius:var(--r);font-weight:600;font-size:.92rem;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-pri{background:var(--pri);color:var(--pri-ink)}
.btn-pri:hover{filter:brightness(1.08)}
.btn-sec{background:var(--surface);border:1px solid var(--line2);color:var(--ink)}
.btn-sec:hover{border-color:var(--mut)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{color:var(--ink2)}
.btn-ghost:hover{background:var(--surface2)}
.btn-sm{height:34px;padding:0 11px;font-size:.86rem}

/* Panel & table */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:.8rem;font-weight:600;color:var(--mut);text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
th:first-child{border-start-start-radius:var(--r-lg)}
th:last-child{border-start-end-radius:var(--r-lg)}
.th{display:flex;align-items:center;gap:4px}
.th-name{padding:2px 4px;margin:-2px -4px;border-radius:5px}
.th-name:hover{background:var(--line);color:var(--ink)}
.th .kind{font-size:.7rem;font-weight:500;color:var(--mut);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
td{padding:4px 6px;border-bottom:1px solid var(--line);font-size:.95rem;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.idx{width:40px;text-align:center;color:var(--mut);font-size:.82rem}
.cell{width:100%;min-width:84px;height:38px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;padding:0 8px;outline:none;transition:border-color .12s,background .12s}
.cell.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;min-width:92px}
.cell.t{min-width:130px}
.cell:hover{background:var(--surface2)}
.cell:focus{border-color:var(--pri);background:var(--surface);box-shadow:0 0 0 3px var(--focus)}
.cell::placeholder{color:var(--line2)}
.rt{text-align:left;font-weight:600;white-space:nowrap;padding-inline:12px;font-variant-numeric:tabular-nums;direction:ltr}
.row-act{width:44px;text-align:center}
.del{width:34px;height:34px;border-radius:var(--r-sm);display:inline-grid;place-items:center;color:var(--mut)}
.del:hover{background:var(--danger-soft);color:var(--danger)}
.edit{width:34px;height:34px;border-radius:var(--r-sm);display:inline-grid;place-items:center;color:var(--mut)}
.edit:hover{background:var(--surface2);color:var(--ink)}
tfoot td{background:var(--surface2);border-top:1px solid var(--line2);border-bottom:none;font-weight:700;padding:12px 10px}
tfoot td.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;padding-inline:16px}
tfoot tr td:first-child{border-end-start-radius:var(--r-lg)}
tfoot tr td:last-child{border-end-end-radius:var(--r-lg)}
.add-row{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:46px;margin-top:10px;border:1px dashed var(--line2);border-radius:var(--r-lg);color:var(--ink2);font-weight:500}
.add-row{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.add-row:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
.empty{padding:48px 20px;text-align:center}
.empty svg{width:36px;height:36px;color:var(--line2);margin-bottom:10px}
.empty h3{font-size:1rem;font-weight:600;margin-bottom:4px}
.empty p{color:var(--mut);font-size:.9rem;margin-bottom:16px}
body.compact td{padding:1px 4px}
body.compact .cell{height:32px}
tr.flash td{animation:flash 2s ease}
@keyframes flash{0%,35%{background:var(--pri-soft)}100%{background:transparent}}

.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:12px}
.inp{height:42px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);padding:0 12px;outline:none;font-size:.95rem;min-width:0}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--focus)}
select.inp{padding-inline-end:8px}


/* linked payments */
.th .kind.link,.pill.link{border-color:color-mix(in srgb,var(--c-teal) 45%,transparent);color:var(--c-teal);background:color-mix(in srgb,var(--c-teal) 10%,transparent)}
tfoot td.link{color:var(--c-teal)}
.pay.linked .d{color:var(--c-teal)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:.84rem;color:var(--ink2);background:color-mix(in srgb,var(--c-teal) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c-teal) 25%,transparent);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.note svg{color:var(--c-teal);margin-top:1px}

/* section header */
.head{background:color-mix(in srgb,var(--sc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 22%,var(--line));border-radius:20px;padding:18px;align-items:center}
.hd-main{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.hd-main h1{display:flex;align-items:center;gap:4px}
.hd-tot{text-align:left}
.hd-tot small{display:block;font-size:.8rem;color:var(--mut)}
.hd-tot b{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.hd-tot b small{display:inline;font-size:.55em;font-weight:500;margin-inline-start:4px}

/* row cards (phone) */
.cards{display:flex;flex-direction:column;gap:10px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.rc.open{border-color:color-mix(in srgb,var(--sc) 45%,var(--line));box-shadow:0 6px 20px rgba(13,60,48,.08)}
.rc-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px 14px 12px;text-align:right}
.rc-n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-size:.82rem;font-weight:600;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent)}
.rc-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rc-t{font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-t.dim{color:var(--mut);font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:.76rem;color:var(--ink2);border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:1px 8px;white-space:nowrap}
.pill b{font-weight:600;font-variant-numeric:tabular-nums;margin-inline-start:2px}
.rc-a{font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc .chev{color:var(--mut);transition:transform .2s}
.rc.open .chev{transform:rotate(180deg)}
.rc-f{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;padding:4px 14px 14px;border-top:1px solid var(--line);padding-top:14px}
.fld{min-width:0}
.fld.wide{grid-column:1/-1}
.fl{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.fl-name{font-size:.8rem;color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .kind{font-size:.66rem;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--mut);white-space:nowrap}
.fl .kind.link{border-color:color-mix(in srgb,var(--c-teal) 45%,transparent);color:var(--c-teal)}
.rc-f .cell{width:100%;min-width:0;height:44px;border:1px solid var(--line2);background:var(--surface);font-size:1rem}
.rc-x{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.rc-sum{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--sc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 22%,var(--line));font-weight:600}
.rc-sum b{font-size:1.1rem;font-variant-numeric:tabular-nums}


/* Home */
.home .h2{margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:right;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s;min-height:150px}
.scard::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--sc);opacity:.85}
.scard:hover{border-color:color-mix(in srgb,var(--sc) 45%,var(--line));box-shadow:0 8px 24px rgba(13,60,48,.08)}
.scard:active{transform:scale(.98)}
.sc-n{font-weight:600;font-size:.96rem;line-height:1.35}
.sc-v{margin-top:auto;display:flex;align-items:baseline;gap:4px}
.sc-v b{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.sc-v small{color:var(--mut);font-size:.8rem}
.sc-c{font-size:.78rem;color:var(--mut)}
.scard.empty-c .tile{filter:saturate(.7)}
.wcard{display:block;width:100%;text-align:right;padding:18px;border-radius:20px;background:color-mix(in srgb,var(--sc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 25%,var(--line));transition:box-shadow .15s}
.wcard:hover{box-shadow:0 8px 24px rgba(13,60,48,.08)}
.wc-top{display:flex;align-items:center;gap:12px}
.wc-n{flex:1;display:flex;flex-direction:column}
.wc-n b{font-size:1.1rem;font-weight:700}
.wc-n small{color:var(--mut);font-size:.84rem}
.wc-kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.wc-kp span{display:flex;flex-direction:column}
.wc-kp small{font-size:.78rem;color:var(--mut)}
.wc-kp b{font-size:1.08rem;font-weight:700}
.wcard .track{display:block}
svg.go{color:var(--mut);transform:none}
svg.flip{transform:scaleX(-1)}
.back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 14px;margin:0 -6px 12px;border-radius:var(--r);color:var(--pri);font-weight:600;font-size:.95rem}
.back:hover{background:var(--pri-soft)}
.tip{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.82rem;margin:22px 4px 0}
.ptitle{font-size:1.45rem;font-weight:700;margin:2px 4px 18px}
.gnote{color:var(--mut);font-size:.83rem;margin:-2px 6px 10px}
.secrow.nav{width:100%;text-align:right}
.secrow.nav:hover{background:var(--surface2)}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 8px;border-bottom:1px solid var(--line)}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx small{display:block;color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tx small.lk{color:var(--c-teal)}
.mrow .amt{font-weight:600;white-space:nowrap}
.rnum{width:26px;height:26px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-size:.78rem;color:var(--mut);flex-shrink:0}
.mempty{padding:16px;color:var(--mut);font-size:.9rem;text-align:center;border-bottom:1px solid var(--line)}
.mform{display:grid;grid-template-columns:1fr 130px auto;gap:8px;padding:12px}
.mfoot{padding:10px}
.panel>.mrow:last-child{border-bottom:none}
@media (max-width:860px){
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .scard{padding:14px;min-height:140px;border-radius:16px}
  .sc-n{font-size:.9rem}
  .sc-v b{font-size:1.12rem}
  .mform{grid-template-columns:1fr 1fr}
  .mform input{grid-column:1/-1}
}


/* sticky row number while scrolling sideways */
td.idx,th.idx,tfoot td:first-child{position:sticky;right:0;z-index:1}
td.idx{background:var(--surface)}
tbody tr:nth-child(even) td.idx{background:var(--surface)}
th.idx{background:var(--surface2)}
tfoot td:first-child{background:var(--surface2)}
td.idx,th.idx{box-shadow:-1px 0 0 var(--line)}
.scroll-hint{display:none;align-items:center;gap:6px;font-size:.8rem;color:var(--mut);margin:0 4px 8px}
@media (max-width:860px){.scroll-hint{display:flex}.cell.n{min-width:96px}.cell.t{min-width:140px}}


/* Section strip (horizontal) */
.strip-wrap{background-color:var(--hero);background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:22px 22px;background-position:center -68px;padding:4px 0 26px;margin-bottom:-12px}
.strip{max-width:1240px;margin:0 auto;display:flex;gap:10px;overflow-x:auto;padding:6px 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.stab{flex:0 0 auto;width:148px;min-height:112px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:right;padding:12px;border-radius:16px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:var(--hero-ink);transition:background .15s,transform .15s}
.stab:hover{background:rgba(255,255,255,.15)}
.stab:active{transform:scale(.97)}
.st-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--sc);color:#fff}
.st-ic svg{width:18px;height:18px}
.st-n{font-size:.86rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-v{margin-top:auto;font-size:.8rem;color:var(--hero-mut);font-weight:500}
.stab[aria-current="true"]{background:var(--surface);color:var(--ink);border-color:var(--surface);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.stab[aria-current="true"] .st-v{color:var(--sc);font-weight:700}
.strip-wrap+.page{position:relative;padding-top:0}

/* Table polish */
.tpanel{overflow:hidden;box-shadow:0 1px 2px rgba(13,60,48,.05),0 8px 24px rgba(13,60,48,.05)}
.tpanel th{background:color-mix(in srgb,var(--sc) 8%,var(--surface2));color:var(--ink2);border-bottom:2px solid color-mix(in srgb,var(--sc) 35%,var(--line))}
.tpanel th.idx{background:color-mix(in srgb,var(--sc) 8%,var(--surface2))}
.tpanel tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--sc) 3%,var(--surface))}
.tpanel tbody tr:nth-child(even) td.idx{background:color-mix(in srgb,var(--sc) 3%,var(--surface))}
.tpanel .rt{color:var(--ink)}
.tpanel tfoot td{background:color-mix(in srgb,var(--sc) 10%,var(--surface2));border-top:2px solid color-mix(in srgb,var(--sc) 35%,var(--line))}
.tpanel td.idx{color:var(--sc);font-weight:600}
.head{box-shadow:0 1px 2px rgba(13,60,48,.05)}

/* Bottom tab active pill */
.tabs button svg{transition:background .2s}
@media (max-width:860px){
  .tabs button{gap:4px}
  .tabs button svg{width:56px;height:30px;padding:4px 17px;border-radius:15px}
  .tabs button[aria-current="page"] svg{background:var(--pri-soft)}
  .stab{width:136px;min-height:106px}
}


/* centre numbers under their column titles */
th.c{text-align:center}
th.c .th{justify-content:center}
.cell.n{text-align:center}
.rt{text-align:center}
tfoot td.n{text-align:center}


/* live-sync status */
.sync{display:inline-flex;align-items:center;gap:5px;margin-inline-start:8px;font-size:.72rem;font-weight:600;padding:1px 8px 1px 7px;border-radius:10px;background:rgba(255,255,255,.12);color:var(--hero-ink);vertical-align:1px}
.sync:empty{display:none}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:#9fb3ab}
.sync.on::before{background:#5ee0a8;box-shadow:0 0 0 3px rgba(94,224,168,.25)}
.sync.wait::before{background:#f3c94e}
.sync.err::before{background:#ff8a7a}
.sync.off{opacity:.8}
.empty label.btn{cursor:pointer}


/* ===== Summary dashboard ===== */
.dash{color:var(--hero-ink);background-color:var(--hero);background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:22px 22px;background-position:center -68px;padding-block:14px 64px}
.dash-in{max-width:820px;margin:0 auto;padding-inline:16px}
.dl{color:var(--hero-mut);font-size:.92rem}
.dbig{font-size:clamp(2.5rem,12vw,3.8rem);font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:2px 0 14px}
.dbig small{font-size:.3em;font-weight:500;color:var(--hero-mut);margin-inline-start:8px;letter-spacing:0}
.sbar{display:flex;gap:3px;height:12px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.12)}
.sbar i{display:block;height:100%}
i.sl{background:rgba(255,255,255,.55)} i.sb{background:#f3c94e}
.slg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:.84rem;color:var(--hero-mut)}
.slg span{display:inline-flex;align-items:center;gap:6px}
.slg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.slg b{color:var(--hero-ink);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px}
.fact{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.fact small{font-size:.78rem;color:var(--hero-mut)}
.fact b{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.fact span{font-size:.76rem;color:var(--hero-mut)}
.dash-page{position:relative;margin-top:-44px;padding-top:0}
.wring{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:right;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(13,60,48,.12)}
.ring{width:92px;height:92px;flex-shrink:0;transform:rotate(-90deg) scaleY(-1)}
.ring circle{fill:none;stroke-width:10}
.ring .rt{stroke:color-mix(in srgb,var(--sc) 14%,var(--surface2))}
.ring .rf{stroke:var(--sc);stroke-linecap:round;transition:stroke-dasharray .6s}
.rpct{position:absolute;right:16px;width:92px;text-align:center;font-weight:700;font-size:1.15rem}
.wr-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.wr-b>b{font-size:1.05rem}
.wr-k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wr-k span{display:flex;flex-direction:column;min-width:0}
.wr-k small{font-size:.74rem;color:var(--mut)}
.wr-k b{font-size:.98rem;font-weight:700;white-space:nowrap}
.hsub{color:var(--mut);font-size:.84rem;margin:-6px 4px 10px}
.blist{overflow:hidden}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 14px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:none}
.brow:hover{background:var(--surface2)}
.bm{display:flex;flex-direction:column;gap:7px;min-width:0}
.bn{font-weight:500;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn small{color:var(--mut);font-weight:400}
.bb{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:flex}
.bb i{display:block;height:100%;background:var(--sc);border-radius:4px}
.bv{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:92px}
.bv b{font-weight:600}
.bv small{color:var(--mut);font-size:.76rem}
.idle{color:var(--mut);font-size:.82rem;margin:10px 4px 0;line-height:1.7}

/* ===== Workers page ===== */
.wsec{margin-top:22px}
.wsec h2{font-size:1.05rem;font-weight:700;margin:0 4px 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wsec h2 small{font-size:.82rem;font-weight:500;color:var(--mut)}
.wsec h2 small b{color:var(--ink);font-weight:600}
.contract{padding:4px 16px}
.ct-row{padding:12px 0;border-bottom:1px solid var(--line)}
.ct-row:last-child{border-bottom:none}
.ct-name{font-weight:600;margin-bottom:10px}
.ct-f{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.cf{display:flex;flex-direction:column;gap:4px;flex:1 1 90px;min-width:0}
.cf span{font-size:.78rem;color:var(--mut)}
.cf .cell{height:44px;border:1px solid var(--line2);background:var(--surface);font-size:1.05rem;font-weight:600;text-align:center;min-width:0}
.cx{color:var(--mut);font-size:1.1rem;padding-bottom:10px}
.ct-tot{display:flex;flex-direction:column;gap:2px;flex:1 1 120px;padding:6px 12px;border-radius:12px;background:color-mix(in srgb,var(--c-teal) 10%,var(--surface))}
.ct-tot small{font-size:.76rem;color:var(--mut)}
.ct-tot b{font-size:1.2rem;font-weight:700;color:var(--c-teal)}
.wsec .pay-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border-bottom:none;background:var(--surface)}
.wsec .pay-form #wpA{font-size:1.15rem;font-weight:600;direction:ltr;text-align:left}
.wsec .pay-form .desc{grid-column:1/-1;order:0}
.wsec .pay-form .btn{grid-column:1/-1;height:46px}
.wsec .pays{list-style:none;overflow:hidden}
.wsec .pay{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 8px}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--c-teal);flex-shrink:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--c-teal) 15%,transparent)}
.pay.linked .pdot{background:var(--sc)}
.wsec .pay .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wsec .pay .t{font-weight:500}
.wsec .pay .d{font-size:.8rem;color:var(--mut);width:auto}
.wsec .pay .a{font-weight:700}

/* Workers ledger */
.ledger{margin-top:28px}
.ledger h2{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.kpi{padding:16px 18px}
.kpi+.kpi{border-inline-start:1px solid var(--line)}
.kpi dt{font-size:.82rem;color:var(--mut);margin-bottom:2px}
.kpi dd{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi dd small{font-size:.78rem;color:var(--mut);font-weight:500;margin-inline-start:4px}
.kpi dt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--kc,var(--mut));margin-inline-end:6px;vertical-align:1px}
.kpi.due{--kc:var(--c-blue)}.kpi.paid{--kc:var(--c-teal)}.kpi.rem{--kc:var(--c-orange)}.kpi.over{--kc:var(--danger)}
.kpi.paid dd{color:var(--c-teal)}
.kpi.over dd{color:var(--danger)}
.progress{padding:14px 18px;border-bottom:1px solid var(--line)}
.progress .lbl{display:flex;justify-content:space-between;font-size:.84rem;color:var(--mut);margin-bottom:8px}
.progress .lbl b{color:var(--ink);font-weight:600}
.track{height:8px;border-radius:4px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--c-teal);border-radius:4px;transition:width .4s}
.pay-form{display:grid;grid-template-columns:150px 1fr 150px auto;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface2)}
.pays{list-style:none}
.pay{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 8px;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:none}
.pay .d{width:96px;flex-shrink:0;font-size:.85rem;color:var(--mut)}
.pay .t{flex:1;min-width:0;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay .t.none{color:var(--mut)}
.pay .a{font-weight:600;font-variant-numeric:tabular-nums}
.pay .btns{display:flex;gap:2px}
.pays-empty{padding:22px;text-align:center;color:var(--mut);font-size:.92rem}

/* Summary */
.total{padding:24px 22px;border-radius:20px;margin-bottom:24px;color:var(--hero-ink);background-color:var(--hero);background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px}
.total p{color:var(--hero-mut);font-size:.95rem}
.total .big{font-size:clamp(2.6rem,9vw,4.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0 6px}
.total .big small{font-size:.32em;font-weight:500;color:var(--hero-mut);letter-spacing:0;margin-inline-start:8px}
.total .meta{color:var(--hero-mut);font-size:.88rem}
.h2{font-size:1.1rem;font-weight:700;margin:28px 0 12px}
.dist{list-style:none}
.dist li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.dist li:last-child{border-bottom:none}
.dist .n{display:flex;align-items:center;gap:10px;font-weight:500;font-size:.93rem;min-width:0}
.dist .n span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist .n .tile{width:28px;height:28px}.dist .n .tile svg{width:16px;height:16px}
.dist .b{height:10px;border-radius:0 4px 4px 0;background:var(--sc);min-width:2px}
.dist .bw{display:flex;justify-content:flex-start}
.dist .v{text-align:left;white-space:nowrap}
.dist .v b{font-weight:600;font-variant-numeric:tabular-nums}
.dist .v small{color:var(--mut);font-size:.8rem;margin-inline-start:8px;display:inline-block;min-width:44px}
.dist li.zero{color:var(--mut)}
.dist li.zero .b{display:none}
.detail{margin-bottom:12px}
.detail summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;font-weight:600}
.detail summary::-webkit-details-marker{display:none}
.detail summary .s{flex:1}
.detail summary .num{font-weight:600}
.detail summary .chev{transition:transform .2s;color:var(--mut)}
.detail[open] summary .chev{transform:rotate(180deg)}
.detail[open] summary{border-bottom:1px solid var(--line)}
.detail table{min-width:480px}
.detail td{padding:10px}

/* Settings */
.group{margin-bottom:28px}
.group h2{font-size:.86rem;font-weight:600;color:var(--mut);margin:0 6px 8px}
.srow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);min-height:60px}
.srow:last-child{border-bottom:none}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:block;font-weight:500;font-size:.96rem}
.srow .tx small{display:block;color:var(--mut);font-size:.83rem;margin-top:1px}
.srow.danger .tx b{color:var(--danger)}
.switch{position:relative;width:46px;height:28px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--line2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--pri)}
.switch input:checked+span::after{transform:translateX(-18px)}
.switch input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.seg button{height:32px;padding:0 12px;border-radius:8px;font-size:.86rem;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1),inset 0 0 0 1px var(--line)}
.secrow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 8px;border-bottom:1px solid var(--line)}
.secrow:last-of-type{border-bottom:none}
.secrow svg.lead{color:var(--mut)}
.secrow .tx{flex:1;min-width:0}
.secrow .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secrow .tx small{color:var(--mut);font-size:.8rem}
.mini{width:34px;height:34px;border-radius:var(--r-sm);display:inline-grid;place-items:center;color:var(--ink2)}
.mini:hover{background:var(--surface2)}
.mini:disabled{opacity:.25;pointer-events:none}
.mini.d:hover{background:var(--danger-soft);color:var(--danger)}

/* Search results */
.res-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.res-head h1{font-size:1.15rem;font-weight:700}
.res-head p{color:var(--mut);font-size:.9rem}
.res-head p b{color:var(--ink);font-weight:600}
.rgroup{margin-bottom:18px}
.rgroup h3{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--mut);font-weight:600;margin:0 4px 8px}
.ritem{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 16px;border-bottom:1px solid var(--line)}
.ritem:last-child{border-bottom:none}
.ritem:hover{background:var(--surface2)}
.ritem:first-child{border-radius:var(--r-lg) var(--r-lg) 0 0}
.ritem:last-child{border-radius:0 0 var(--r-lg) var(--r-lg)}
.ritem .b{flex:1;min-width:0}
.ritem .m{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .s{font-size:.82rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ritem .k{font-size:.75rem;color:var(--mut);border:1px solid var(--line2);border-radius:4px;padding:0 5px;flex-shrink:0}
mark{background:var(--pri-soft);color:var(--pri);border-radius:3px;padding:0 1px;font-weight:600}

/* Dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:130;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}
.dlg{background:var(--surface);border-radius:18px;width:100%;max-width:400px;padding:22px;box-shadow:0 24px 64px rgba(0,0,0,.28);animation:rise .2s cubic-bezier(.2,.8,.2,1)}
.dlg h2{font-size:1.12rem;font-weight:700;margin-bottom:6px}
.dlg p{color:var(--ink2);font-size:.93rem;margin-bottom:18px}
.dlg .amt{display:block;margin-top:6px;color:var(--ink);font-weight:600}
.dlg label{display:block;font-size:.84rem;font-weight:500;color:var(--ink2);margin:0 2px 6px}
.dlg .inp{width:100%;margin-bottom:14px}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .foot{display:flex;gap:8px;justify-content:flex-start;margin-top:6px}
.dlg .foot .btn{flex:1}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.kinds button{height:38px;border-radius:var(--r-sm);border:1px solid var(--line2);font-size:.86rem;color:var(--ink2)}
.kinds button[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:600}
.hint{font-size:.8rem;color:var(--mut);margin-bottom:14px}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.icons button{height:44px;border-radius:var(--r-sm);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.icons button[aria-pressed="true"]{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--sc);box-shadow:0 0 0 2px var(--surface),0 0 0 2px var(--surface)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sc)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* Snackbar */
.snack{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:120;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 16px;padding-inline-start:16px;display:flex;align-items:center;gap:14px;font-size:.92rem;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}
.snack.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack span{padding:8px 0}
.snack button{height:36px;padding:0 12px;border-radius:8px;color:var(--bg);font-weight:700;display:flex;align-items:center;gap:6px;opacity:.95}
.snack button:hover{background:rgba(255,255,255,.12)}
.snack button[hidden]{display:none}

/* Bottom tabs (mobile) */
.tabs{display:none}

@media (max-width:860px){

  var Q={"الكمية":1,"عدد الأمتار":1},P={"السعر":1,"سعر المتر":1,"سعر الوحدة":1};
  S.secs.forEach(function(s){

    if(s.id==="workers")s.cols=s.cols.filter(function(c){return c.k!=="الإجمالي المستحق";});
    var hasQ=s.cols.some(function(c){return c.n===2||(c.n===1&&Q[c.k]);}),hasP=s.cols.some(function(c){return c.n===3||(c.n===1&&P[c.k]);});

  if(!S.settings.linkMig2b){S.secs.forEach(function(s){if(s.id!=="workers"&&/الأيدي العاملة/.test(s.lb))s.cols.forEach(function(c){if(c.n===4)c.n=1;});});S.settings.linkMig2b=true;}

}
var _flushing=false,_again=false;
async function flush(){
  if(_flushing){_again=true;return;}
  _flushing=true;
  try{
    do{
      _again=false;
      var want=docsFromState(),ops=[];
      Object.keys(want).forEach(function(k){var j=JSON.stringify(want[k]);if(SYNC.synced[k]!==j)ops.push([k,want[k],j]);});
      Object.keys(SYNC.synced).forEach(function(k){if(!(k in want))ops.push([k,null,null]);});
      for(var n=0;n<ops.length;n++){
        var op=ops[n];
        try{
          if(op[1]===null){await SYNC.db.doc(op[0]).delete();delete SYNC.synced[op[0]];}
          else{await SYNC.db.doc(op[0]).set(op[1]);SYNC.synced[op[0]]=op[2];}
        }catch(e){
          var c=e&&e.code;
          if(c==="invalid_argument"){SYNC.mode="ro";setSync();render();return;}
          if(c==="denied"){SYNC.mode="denied";SYNC.ready=false;setSync();render();return;}
          if(c==="quota_exceeded"){snack("المساحة المشتركة ممتلئة. احذف بعض السطور ثم حاول مرة أخرى");setSync("error");return;}
          if(c==="revoked"||c==="not_granted"||c==="capability_disabled"){SYNC.mode="local";setSync();return;}
          await new Promise(function(r){setTimeout(r,600+Math.random()*600);});
          try{if(op[1]===null){await SYNC.db.doc(op[0]).delete();delete SYNC.synced[op[0]];}else{await SYNC.db.doc(op[0]).set(op[1]);SYNC.synced[op[0]]=op[2];}}
          catch(e2){setSync("error");return;}
        }

    }while(_again);

  }finally{_flushing=false;}
}

/* ───────── Search ───────── */
function norm(s){
  return String(s==null?"":s).toLowerCase().replace(/[ً-ْـ]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[٠-٩]/g,function(d){return"٠١٢٣٤٥٦٧٨٩".indexOf(d);}).replace(/,/g,"").trim();
}
function hl(text,q){
  text=String(text==null?"":text);var nt=norm(text),i=nt.indexOf(q);
  if(i<0||nt.length!==text.toLowerCase().replace(/,/g,"").trim().length)return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function search(qraw){
  var q=norm(qraw),out=[];if(!q)return out;
  S.secs.forEach(function(sec){
    var g={sec:sec,cols:[],rows:[],pays:[]};
    sec.cols.forEach(function(c){if(norm(c.k).indexOf(q)>=0)g.cols.push({c:c,sum:(c.n===1||c.n===2)?(S.data[sec.id]||[]).reduce(function(a,r){return a+num(r[c.k]);},0):null});});
    (S.data[sec.id]||[]).forEach(function(r,i){
      var hits=sec.cols.filter(function(c){var v=r[c.k];if(v==null||v==="")return false;if(c.n&&!num(v))return false;return norm(v).indexOf(q)>=0;});
      if(hits.length)g.rows.push({i:i,r:r,hits:hits});
    });
    if(sec.id==="workers")S.wp.forEach(function(p,i){if(norm(p.desc).indexOf(q)>=0||norm(p.d).indexOf(q)>=0||norm(fdate(p.d)).indexOf(q)>=0||norm(p.a).indexOf(q)>=0)g.pays.push({p:p,i:i});});
    if(norm(sec.lb).indexOf(q)>=0||g.cols.length||g.rows.length||g.pays.length)out.push(g);
  });
  return out;
}
function vSearch(){
  var q=norm(S.q),res=search(S.q),n=0,tot=0;
  if(!res.length)return'<div class="page single"><div class="panel empty">'+ic("search")+'<h3>لا توجد نتائج لـ «'+esc(S.q)+'»</h3><p>جرّب كلمة أقصر، أو جزءاً من المبلغ.</p></div></div>';
  var h="";
  res.forEach(function(g){
    var sec=g.sec,items="";
    g.cols.forEach(function(x){n++;if(x.sum!==null&&x.c.n===1&&!g.rows.length)tot+=x.sum;
      items+='<button class="ritem" data-act="goSec" data-sid="'+sec.id+'"><span class="k">عمود</span><span class="b"><div class="m">'+hl(x.c.k,q)+'</div><div class="s">'+KINDS[x.c.n]+'، في '+plural((S.data[sec.id]||[]).length,"سطر واحد","سطرين","سطور","سطراً")+'</div></span>'+(x.sum!==null?'<span class="a num">'+(x.c.n===2?fq(x.sum):f(x.sum))+'</span>':'')+'</button>';});
    g.rows.forEach(function(x){n++;
      var r=x.r,rt=rT(r,sec.cols);if(sec.id!=="workers")tot+=rt;
      var txt=sec.cols.filter(function(c){return !c.n&&r[c.k];}).map(function(c){return hl(r[c.k],q);}).join("، ");
      var parts=sec.cols.filter(function(c){return c.n&&num(r[c.k]);}).map(function(c){return esc(c.k)+" "+(x.hits.indexOf(c)>=0?hl(r[c.k],q):esc(r[c.k]));});
      var main=txt||parts.shift()||("السطر "+(x.i+1));
      items+='<button class="ritem" data-act="goRow" data-sid="'+sec.id+'" data-i="'+x.i+'"><span class="k">سطر '+(x.i+1)+'</span><span class="b"><div class="m">'+main+'</div><div class="s">'+parts.slice(0,4).join("، ")+'</div></span><span class="a num">'+f(rt)+'</span></button>';
    });
    g.pays.forEach(function(x){n++;tot+=num(x.p.a);
      items+='<button class="ritem" data-act="goPay" data-i="'+x.i+'"><span class="k">دفعة</span><span class="b"><div class="m">'+(x.p.desc?hl(x.p.desc,q):'دفعة بدون بيان')+'</div><div class="s num" style="text-align:right">'+hl(fdate(x.p.d),q)+'</div></span><span class="a num">'+hl(f(x.p.a),q)+'</span></button>';});
    if(!items){n++;items='<button class="ritem" data-act="goSec" data-sid="'+sec.id+'"><span class="k">قسم</span><span class="b"><div class="m">'+hl(sec.lb,q)+'</div></span><span class="a num">'+f(secT(sec))+'</span></button>';}
    h+='<section class="rgroup"><h3>'+tile(sec)+esc(sec.lb)+'</h3><div class="panel">'+items+'</div></section>';
  });
  return'<div class="page single"><div class="res-head"><h1>'+plural(n,"نتيجة واحدة","نتيجتان","نتائج","نتيجة")+'</h1><p>مجموع المبالغ المطابقة <b class="num">'+f(tot)+'</b> ر.ع.</p></div>'+h+'</div>';
}

    case"reset":b='<h2>إعادة تعيين كل البيانات؟</h2><p>سيُحذف كل ما سجّلته على هذا الجهاز. ننصح بحفظ نسخة احتياطية أولاً.</p>'+foot("إعادة التعيين",1);break;
    case"renameProj":b='<h2>اسم المشروع</h2><p></p><input class="inp" id="mIn" value="'+esc(m.v)+'"/>'+foot("حفظ");break;
    case"editPay":b='<h2>تعديل الدفعة</h2><p></p><label for="mIn">البيان</label><input class="inp" id="mIn" value="'+esc(m.desc)+'" placeholder="بدون بيان"/><div class="row2"><div><label for="mD">التاريخ</label><input class="inp" id="mD" type="date" value="'+esc(m.d)+'"/></div><div><label for="mA">المبلغ</label><input class="inp" id="mA" inputmode="decimal" value="'+esc(m.a)+'" style="direction:ltr;text-align:left"/></div></div>'
      +foot("حفظ");break;
    case"editCol":b='<h2>تعديل العمود</h2><p></p><label for="mIn">الاسم</label><input class="inp" id="mIn" value="'+esc(m.k)+'"/><label>النوع</label><div class="kinds">'+KIND_ORDER.map(function(t){return'<button data-kind="'+t+'" aria-pressed="'+(m.n==t)+'">'+KINDS[t]+'</button>';}).join("")+'</div><div class="hint">الكمية تُضرب في سعر الوحدة. و«دفعة للعمال» تُخصم من مستحق الأيدي العاملة ولا تُحسب مرتين.</div>'
      +foot("حفظ");break;
    case"editSec":case"newSec":b='<h2>'+(m.t==="newSec"?"قسم جديد":"تعديل القسم")+'</h2><p></p><label for="mIn">الاسم</label><input class="inp" id="mIn" value="'+esc(m.lb)+'" placeholder="مثل: الدهانات"/><label>اللون</label><div class="swatches">'+COLORS.map(function(c){return'<button data-color="'+c+'" style="--sc:var(--c-'+c+')" aria-pressed="'+(m.c===c)+'" aria-label="'+c+'"></button>';}).join("")+'</div><label>الأيقونة</label><div class="icons" style="'+sc(m)+'">'+SEC_ICONS.map(function(k){return'<button data-icon="'+k+'" aria-pressed="'+(m.ic===k)+'" aria-label="'+k+'">'+ic(k)+'</button>';}).join("")+'</div>'+foot(m.t==="newSec"?"إضافة القسم":"حفظ");break;
  }
  return'<div class="scrim" data-act="scrim"><div class="dlg" role="dialog" aria-modal="true">'+b+'</div></div>';
}
function keepInputs(){var m=S.modal;if(!m)return;var a=document.getElementById("mIn");if(a){if(m.t==="editCol")m.k=a.value;else if(m.t==="editPay")m.desc=a.value;else m.lb=a.value;}}

/* Destructive actions: confirm (if enabled), then apply with undo */
function ask(m){if(S.settings.confirmDelete||m.t==="reset"){S.modal=m;render();}else{S.modal=m;doModal();}}
function doModal(){
  var m=S.modal;if(!m)return;
  var inp=document.getElementById("mIn"),val=inp?inp.value.trim():"",sec,msg="تم الحفظ",undo=false;
  if(inp&&!val&&m.t!=="editPay"){inp.focus();inp.style.borderColor="var(--danger)";return;}
  switch(m.t){
    case"delRow":snapshot();S.data[m.sid].splice(m.i,1);S.open={};msg="تم حذف السطر";undo=true;break;
    case"delCol":snapshot();sec=S.secs.find(function(s){return s.id===m.sid;});sec.cols.splice(m.ci,1);(S.data[m.sid]||[]).forEach(function(r){delete r[m.k0||m.k];});msg="تم حذف العمود";undo=true;break;
    case"delLinked":snapshot();var lr2=S.data[m.sid][m.i];lr2[m.k]=0;delete lr2._d;delete lr2._desc;if(lr2._auto&&!S.secs.find(function(x){return x.id===m.sid;}).cols.some(function(c){return c.n&&num(lr2[c.k]);}))S.data[m.sid].splice(m.i,1);msg="تم حذف الدفعة";undo=true;break;
    case"delPay":snapshot();S.wp.splice(m.i,1);msg="تم حذف الدفعة";undo=true;break;
    case"delSec":snapshot();S.secs=S.secs.filter(function(s){return s.id!==m.id;});delete S.data[m.id];if(S.act===m.id)S.act="";if(S.view==="manage"){S.view="settings";S.msec=null;}msg="تم حذف القسم";undo=true;break;
    case"reset":snapshot();S.secs=clone(DSECS);S.data=clone(DDATA);S.wp=[];S.act="";msg="تمت إعادة التعيين";undo=true;break;
    case"renameProj":S.name=val;break;
    case"editPay":
      var a=num(document.getElementById("mA").value);if(!a){var ma=document.getElementById("mA");ma.focus();ma.style.borderColor="var(--danger)";return;}
      S.wp[m.i]=Object.assign({},S.wp[m.i],{d:document.getElementById("mD").value,desc:val,a:a});msg="تم تعديل الدفعة";break;
    case"editCol":
      sec=S.secs.find(function(s){return s.id===m.sid;});var col=sec.cols[m.ci];
      if(val!==col.k&&sec.cols.some(function(c){return c.k===val;})){snack("يوجد عمود بالاسم نفسه");return;}
      if(val!==col.k)(S.data[m.sid]||[]).forEach(function(r){r[val]=r[col.k];delete r[col.k];});
      col.k=val;col.n=+m.n;msg="تم تعديل العمود";break;
    case"editSec":sec=S.secs.find(function(s){return s.id===m.id;});sec.lb=val;sec.ic=m.ic;sec.c=m.c;msg="تم تعديل القسم";break;
    case"newSec":var id="sec_"+Date.now();S.secs.push({id:id,lb:val,ic:m.ic||"folder",c:m.c||"teal",cols:[{k:"البيان",n:0},{k:"المبلغ",n:1},{k:"ملاحظات",n:0}]});S.data[id]=[];S.msec=id;S.view="manage";msg="تمت إضافة القسم";break;
  }
  S.modal=null;save();render();snack(msg,undo);
}

/* ───────── Events ───────── */
function bind(){
  var root=document.getElementById("root");
  if(SYNC.mode==="ro")root.querySelectorAll(".cell,.pay-form input,.pay-form button,.add-row").forEach(function(x){x.disabled=true;});
  var mi=document.getElementById("mIn");if(mi&&!mi._b){mi._b=1;setTimeout(function(){mi.focus();},50);mi.onkeydown=function(e){if(e.key==="Enter")doModal();};}
  var qi=document.getElementById("q");if(qi&&!qi._b){qi._b=1;qi.oninput=function(){S.q=qi.value;renderContent();};}
  root.querySelectorAll(".impf").forEach(function(x){x.onchange=xImport;});
  var nci=document.getElementById("nci");if(nci&&!nci._b){nci._b=1;nci.oninput=function(){S.ncn=nci.value;};nci.onkeydown=function(e){if(e.key==="Enter")addCol();};}
  var nct=document.getElementById("nct");if(nct)nct.onchange=function(){S.nct=+nct.value;};
  var wa=document.getElementById("wpA");if(wa)wa.onkeydown=function(e){if(e.key==="Enter")addPay();};
  root.querySelectorAll("[data-set]").forEach(function(el){el.onchange=function(){S.settings[el.dataset.set]=el.checked;save();render();};});
  root.querySelectorAll(".cell").forEach(function(inp){
    inp.oninput=function(){
      var sec=cs(),i=+inp.dataset.i,c=sec.cols[+inp.dataset.ci];
      S.data[sec.id][i][c.k]=c.n?inp.value.replace(/[٠-٩]/g,function(d){return"٠١٢٣٤٥٦٧٨٩".indexOf(d);}).replace(/[^\d.\-]/g,""):inp.value;save();
      document.getElementById("rt"+i).textContent=f(rT(S.data[sec.id][i],sec.cols));
      var st=document.getElementById("secTot");if(st)st.textContent=f(rowsT(sec));
      var ps=document.getElementById("psubT");if(ps)ps.textContent=f(rowsT(sec));
      var fc=document.getElementById("ft"+inp.dataset.ci);if(fc)fc.textContent=c.n===2?fq(S.data[sec.id].reduce(function(x,r){return x+num(r[c.k]);},0)):f(S.data[sec.id].reduce(function(x,r){return x+num(r[c.k]);},0));
      var lt=document.getElementById("lnkTot");if(lt){var lc=sec.cols.filter(function(c){return c.n===4;});lt.textContent=f(S.data[sec.id].reduce(function(x,r){return x+lc.reduce(function(y,c){return y+num(r[c.k]);},0);},0));}
      var hd=document.getElementById("hdTot");if(hd)hd.firstChild.textContent=f(sec.id==="workers"?wDue():rowsT(sec));
      var hs=document.querySelector(".proj .tot");if(hs)hs.textContent=f(gT());
    };
    inp.onchange=function(){if(cs().id==="workers")render();};
  });
}
function addPay(){
  var ae=document.getElementById("wpA"),a=num(ae.value);
  if(!a){ae.focus();ae.style.borderColor="var(--danger)";snack("أدخل مبلغ الدفعة");return;}
  var d=document.getElementById("wpD").value,desc=document.getElementById("wpT").value.trim(),T=payTarget();
  if(T){var pi=placePay(T,a,d,desc);save();S.flash="lpay-"+T.sec.id+"-"+pi;render();snack("سُجّلت الدفعة وأُضيفت في "+T.sec.lb);return;}
  S.wp.push({id:newId(),t:Date.now(),d:d,desc:desc,a:a});save();
  S.flash="pay-"+(S.wp.length-1);render();snack("تم تسجيل الدفعة");
}
function curSec(){return S.view==="manage"?(S.secs.find(function(s){return s.id===S.msec;})||cs()):cs();}
function push(){try{history.pushState({v:1},"");}catch(e){}}
window.addEventListener("popstate",function(){
  if(S.modal){S.modal=null;}
  else if(S.view==="manage"){S.view="settings";S.msec=null;}
  
  render();window.scrollTo(0,0);
});
function addCol(){
  var name=(S.ncn||"").trim(),sec=curSec();if(!name){snack("اكتب اسم العمود");return;}
  if(sec.cols.some(function(c){return c.k===name;})){snack("يوجد عمود بالاسم نفسه");return;}
  sec.cols.push({k:name,n:+S.nct});(S.data[sec.id]||[]).forEach(function(r){r[name]=+S.nct?0:"";});
  S.ncn="";S.addCol=false;save();render();snack("تمت إضافة العمود «"+name+"»");
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act],[data-view],[data-sec],[data-kind],[data-icon],[data-seg],[data-color]");
  if(S.menu&&!e.target.closest(".menu-wrap")){S.menu=false;render();if(!el)return;}
  if(!el)return;
  if(el.dataset.view){var wasDeep=(S.view==="sheet"&&S.act)||S.view==="manage";S.view=el.dataset.view;S.msec=null;S.sOpen=false;S.q="";S.open={};render();window.scrollTo(0,0);return;}
  if(el.dataset.sec){S.act=el.dataset.sec;S.open={};render();return;}
  if(el.dataset.kind!==undefined){keepInputs();S.modal.n=+el.dataset.kind;render();return;}
  if(el.dataset.icon){keepInputs();S.modal.ic=el.dataset.icon;render();return;}
  if(el.dataset.color){keepInputs();S.modal.c=el.dataset.color;render();return;}
  if(el.dataset.seg){var k=el.dataset.seg,v=el.dataset.v;S.settings[k]=k==="decimals"?+v:v;save();render();return;}
  var a=el.dataset.act,sec=curSec(),i=+el.dataset.i;
  switch(a){
    case"scrim":if(e.target===el){S.modal=null;render();}return;
    case"mClose":S.modal=null;render();return;
    case"mOk":doModal();return;
    case"menu":S.menu=!S.menu;render();return;
    case"excel":S.menu=false;render();xExcel();return;
    case"json":S.menu=false;render();xJSON();return;
    case"search":S.sOpen=!S.sOpen;if(!S.sOpen)S.q="";S.menu=false;render();var q1=document.getElementById("q");if(q1)q1.focus();return;
    case"clearQ":S.q="";render();var q2=document.getElementById("q");if(q2)q2.focus();return;
    case"back":if(history.state){history.back();}else{if(S.view==="manage"){S.view="settings";S.msec=null;}else{S.act="";}render();window.scrollTo(0,0);}return;
    case"manage":S.view="manage";S.msec=el.dataset.id;S.ncn="";push();render();window.scrollTo(0,0);return;
    case"addRowM":S.data[sec.id]=S.data[sec.id]||[];S.data[sec.id].push(blank(sec.cols));save();render();snack("تمت إضافة سطر. عبّئه من صفحة القسم");return;
    case"delCol":var dc=sec.cols[+el.dataset.ci];ask({t:"delCol",sid:sec.id,ci:+el.dataset.ci,k:dc.k});return;
    case"goSec":S.act=el.dataset.sid;S.view="sheet";S.sOpen=false;S.q="";render();window.scrollTo(0,0);return;
    case"goRow":S.act=el.dataset.sid;S.view="sheet";S.sOpen=false;S.q="";S.open[el.dataset.sid+":"+el.dataset.i]=true;S.flash="row-"+el.dataset.sid+"-"+el.dataset.i;render();return;
    case"goPay":S.act="workers";S.view="sheet";S.sOpen=false;S.q="";S.flash="pay-"+el.dataset.i;render();return;
    case"toggleRow":var key=sec.id+":"+i;S.open[key]=!S.open[key];render();if(S.open[key]){var art=document.getElementById("row-"+sec.id+"-"+i);if(art)art.scrollIntoView({block:"nearest",behavior:"smooth"});}return;
    case"addRow":S.data[sec.id]=S.data[sec.id]||[];S.data[sec.id].push(blank(sec.cols));S.open[sec.id+":"+(S.data[sec.id].length-1)]=true;save();render();
      var last=document.querySelector("tbody tr:last-child .cell")||document.querySelector(".rc:last-of-type .rc-f .cell");if(last)last.scrollIntoView({block:"center"});if(last)last.focus({preventScroll:false});return;
    case"delRow":ask({t:"delRow",sid:sec.id,i:i,tot:rT(S.data[sec.id][i],sec.cols)});return;
    case"editCol":var c=sec.cols[+el.dataset.ci];S.modal={t:"editCol",sid:sec.id,ci:+el.dataset.ci,k:c.k,k0:c.k,n:c.n};render();return;
    case"delColFromEdit":var m=S.modal;S.modal=null;ask({t:"delCol",sid:m.sid,ci:m.ci,k:m.k0});return;
    case"toggleAddCol":S.addCol=!S.addCol;S.ncn="";render();return;
    case"addCol":addCol();return;
    case"addPay":addPay();return;
    case"delLinked":var ls=S.secs.find(function(x){return x.id===el.dataset.sid;}),lr=S.data[ls.id][i];ask({t:"delLinked",sid:ls.id,lb:ls.lb,i:i,k:el.dataset.k,a:num(lr[el.dataset.k])});return;
    case"editPay":var p=S.wp[i];S.modal={t:"editPay",i:i,d:p.d,desc:p.desc,a:p.a};render();return;
    case"delPay":var p2=S.wp[i];ask({t:"delPay",i:i,a:p2.a,d:p2.d,desc:p2.desc});return;
    case"delPayFromEdit":var mp=S.modal,p3=S.wp[mp.i];S.modal=null;ask({t:"delPay",i:mp.i,a:p3.a,d:p3.d,desc:p3.desc});return;
    case"renameProj":S.menu=false;S.modal={t:"renameProj",v:S.name};render();return;
    case"editSec":var s=S.secs.find(function(x){return x.id===el.dataset.id;});S.modal={t:"editSec",id:s.id,lb:s.lb,ic:s.ic,c:s.c};render();return;
    case"newSec":S.modal={t:"newSec",lb:"",ic:"folder",c:COLORS[S.secs.length%COLORS.length]};render();return;
    case"delSec":var s2=S.secs.find(function(x){return x.id===el.dataset.id;});ask({t:"delSec",id:s2.id,lb:s2.lb});return;
    case"secUp":case"secDown":var j=a==="secUp"?i-1:i+1,tmp=S.secs[i];S.secs[i]=S.secs[j];S.secs[j]=tmp;save();render();return;
    case"reset":ask({t:"reset"});return;
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(S.modal){S.modal=null;render();}else if(S.menu){S.menu=false;render();}else if(S.sOpen){S.sOpen=false;S.q="";render();}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();S.sOpen=true;render();var q=document.getElementById("q");if(q)q.focus();}
});
try{render();}catch(err){document.getElementById("root").innerHTML='<div style="padding:40px 20px;font:16px system-ui;text-align:center">حدث خطأ أثناء فتح التطبيق<br><small style="color:#888">'+esc(err&&err.message||err)+'</small></div>';}
try{startSync();}catch(err){}
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){});}
</script>
